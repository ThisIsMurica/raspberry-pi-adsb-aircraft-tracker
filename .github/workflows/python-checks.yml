name: Offline Python checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q adsb_matrix.py adsb_roll.py adsb_lookup_cache.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
